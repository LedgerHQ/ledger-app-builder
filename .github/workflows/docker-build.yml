# Build the docker images and push them to GitHub Packages

---
name: Build Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_PATH: ${{ github.repository }}
  REPO_NAME: ${{ github.event.repository.name }}
  BUILD_PLATFORMS: linux/amd64,linux/arm64
  LITE_IMAGE: local/ledger-app-builder-lite:ci
  FULL_IMAGE: local/ledger-app-builder:ci
  DEV_TOOLS_IMAGE: local/ledger-app-dev-tools:ci

jobs:
  check_changelog:
    name: Check changelog versions
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Get current version
        id: get-current-version
        run: |
          echo "current_version=$(grep -Po '(?<=## \[)(\d+\.)+[^\]]' CHANGELOG.md | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check already existing image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get tags of all images from GHCR
          TAGS_FULL=$(curl -H "Authorization: Bearer ${GH_TOKEN}" https://ghcr.io/v2/${REPO_PATH,,}/${REPO_NAME,,}/tags/list)
          TAGS_LITE=$(curl -H "Authorization: Bearer ${GH_TOKEN}" https://ghcr.io/v2/${REPO_PATH,,}/${REPO_NAME,,}-lite/tags/list)
          TAGS_DEV_TOOLS=$(curl -H "Authorization: Bearer ${GH_TOKEN}" https://ghcr.io/v2/${REPO_PATH,,}/ledger-app-dev-tools/tags/list)

          # Concatenate all tags from json fields in one string without brackets
          ALL_TAGS=$(echo $TAGS_FULL $TAGS_LITE $TAGS_DEV_TOOLS | jq -s '.[0].tags + .[1].tags + .[2].tags' | tr -d '[]')

          # Get the tag to find
          TAG_TO_FIND=${{ steps.get-current-version.outputs.current_version }}

          # Check if the tag to find is already present in the list of tags
          if [[ "$ALL_TAGS" == *"$TAG_TO_FIND"* ]]; then
            echo "An image tagged with the latest changelog version already exists on GHCR. Please update the changelog."
            exit 1
          fi
    outputs:
      current_version: ${{ steps.get-current-version.outputs.current_version }}

  mods_list:
    name: Get modified files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changes
        id: get-changes
        uses: tj-actions/changed-files@v47
    outputs:
      modified_files: ${{ steps.get-changes.outputs.all_modified_files }}

  get_speculos_version:
    name: Get latest Speculos version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      speculos_version: ${{ steps.get-speculos-version.outputs.speculos_version }}
    steps:
      - name: Get latest Speculos version
        id: get-speculos-version
        run: |
          SPECULOS_VERSION=$(curl -s https://api.github.com/repos/LedgerHQ/speculos/releases/latest | grep -Po '"tag_name": "\K(.*)(?=")')
          echo "Got speculos version ${SPECULOS_VERSION}"
          echo "speculos_version=$SPECULOS_VERSION" >> "$GITHUB_OUTPUT"

  build_images:
    name: Build images (lite -> full -> dev-tools)
    needs: [mods_list, check_changelog, get_speculos_version]
    if: needs.check_changelog.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      build_lite: ${{ steps.plan.outputs.build_lite }}
      build_full: ${{ steps.plan.outputs.build_full }}
      build_dev_tools: ${{ steps.plan.outputs.build_dev_tools }}
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Plan builds
        id: plan
        env:
          MODIFIED_FILES: ${{ needs.mods_list.outputs.modified_files }}
        run: |
          BUILD_LITE=false
          BUILD_FULL=false
          BUILD_DEV_TOOLS=false

          if [[ "$MODIFIED_FILES" == *"lite/Dockerfile"* ]]; then
            BUILD_LITE=true
          fi
          if [[ "$BUILD_LITE" == "true" || "$MODIFIED_FILES" == *"full/Dockerfile"* ]]; then
            BUILD_FULL=true
          fi
          if [[ "$BUILD_FULL" == "true" || "$MODIFIED_FILES" == *"dev-tools/Dockerfile"* ]]; then
            BUILD_DEV_TOOLS=true
          fi

          echo "build_lite=$BUILD_LITE" >> "$GITHUB_OUTPUT"
          echo "build_full=$BUILD_FULL" >> "$GITHUB_OUTPUT"
          echo "build_dev_tools=$BUILD_DEV_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Build lite image
        if: steps.plan.outputs.build_lite == 'true'
        run: docker build -f lite/Dockerfile -t ${{ env.LITE_IMAGE }} .

      - name: Build full image
        if: steps.plan.outputs.build_full == 'true'
        run: |
          BUILD_ARGS=()
          if [[ "${{ steps.plan.outputs.build_lite }}" == "true" ]]; then
            BUILD_ARGS+=(--build-arg "BASE_IMAGE=${{ env.LITE_IMAGE }}")
          fi
          docker build -f full/Dockerfile "${BUILD_ARGS[@]}" -t ${{ env.FULL_IMAGE }} .

      - name: Build dev-tools image
        if: steps.plan.outputs.build_dev_tools == 'true'
        run: |
          BUILD_ARGS=(--build-arg "SPECULOS_VERSION=${{ needs.get_speculos_version.outputs.speculos_version }}")
          if [[ "${{ steps.plan.outputs.build_full }}" == "true" ]]; then
            BUILD_ARGS+=(--build-arg "BASE_IMAGE=${{ env.FULL_IMAGE }}")
          fi
          docker build -f dev-tools/Dockerfile "${BUILD_ARGS[@]}" -t ${{ env.DEV_TOOLS_IMAGE }} .

      - name: Save lite image
        if: steps.plan.outputs.build_lite == 'true'
        run: docker save ${{ env.LITE_IMAGE }} -o /tmp/ledger-app-builder-lite.tar

      - name: Upload lite artifact
        if: steps.plan.outputs.build_lite == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-builder-lite
          path: /tmp/ledger-app-builder-lite.tar
          retention-days: 1

      - name: Save full image
        if: steps.plan.outputs.build_full == 'true'
        run: docker save ${{ env.FULL_IMAGE }} -o /tmp/ledger-app-builder.tar

      - name: Upload full artifact
        if: steps.plan.outputs.build_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-builder
          path: /tmp/ledger-app-builder.tar
          retention-days: 1

      - name: Save dev-tools image
        if: steps.plan.outputs.build_dev_tools == 'true'
        run: docker save ${{ env.DEV_TOOLS_IMAGE }} -o /tmp/ledger-app-dev-tools.tar

      - name: Upload dev-tools artifact
        if: steps.plan.outputs.build_dev_tools == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-dev-tools
          path: /tmp/ledger-app-dev-tools.tar
          retention-days: 1

  test_builder_lite:
    name: Test App Builder Lite
    needs: build_images
    if: needs.build_images.outputs.build_lite == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download lite image
        uses: actions/download-artifact@v8
        with:
          name: ledger-app-builder-lite
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/ledger-app-builder-lite.tar

      - name: Clone app-boilerplate
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/app-boilerplate
          path: app-boilerplate

      - name: Build app-boilerplate
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate:/app \
            ${{ env.LITE_IMAGE }} \
            bash -c "make -j"

      - name: Run unit tests
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate:/app \
            ${{ env.LITE_IMAGE }} \
            bash -c "cd unit-tests && cmake -Bbuild -H. && make -C build && CTEST_OUTPUT_ON_FAILURE=1 make -C build test"

  test_dev_tools:
    name: Test App Dev Tools
    needs: build_images
    if: needs.build_images.outputs.build_dev_tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download dev-tools image
        uses: actions/download-artifact@v8
        with:
          name: ledger-app-dev-tools
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/ledger-app-dev-tools.tar

      - name: Clone app-boilerplate
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/app-boilerplate
          path: app-boilerplate

      - name: Build app-boilerplate
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate:/app \
            ${{ env.DEV_TOOLS_IMAGE }} \
            bash -c "make -j"

      - name: Run unit tests
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate:/app \
            ${{ env.DEV_TOOLS_IMAGE }} \
            bash -c "cd unit-tests && cmake -Bbuild -H. && make -C build && CTEST_OUTPUT_ON_FAILURE=1 make -C build test"

      - name: Run functional tests
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate:/app \
            ${{ env.DEV_TOOLS_IMAGE }} \
            bash -c "source /opt/venv/bin/activate && pip install -r tests/standalone/requirements.txt && pytest tests/standalone/ --tb=short -v --device nanosp"

  test_builder_rust:
    name: Test App Builder Full (Rust)
    needs: build_images
    if: needs.build_images.outputs.build_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download full image
        uses: actions/download-artifact@v8
        with:
          name: ledger-app-builder
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/ledger-app-builder.tar

      - name: Clone app-boilerplate-rust
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/app-boilerplate-rust
          path: app-boilerplate-rust

      - name: Build app-boilerplate-rust
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate-rust:/app \
            ${{ env.FULL_IMAGE }} \
            bash -c "cargo ledger build nanosplus"

  test_dev_tools_rust:
    name: Test App Dev Tools (Rust)
    needs: build_images
    if: needs.build_images.outputs.build_dev_tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download dev-tools image
        uses: actions/download-artifact@v8
        with:
          name: ledger-app-dev-tools
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/ledger-app-dev-tools.tar

      - name: Clone app-boilerplate-rust
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/app-boilerplate-rust
          path: app-boilerplate-rust

      - name: Build app-boilerplate-rust
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate-rust:/app \
            ${{ env.DEV_TOOLS_IMAGE }} \
            bash -c "cargo ledger build nanosplus"

      - name: Run functional tests
        run: |
          docker run --rm -v ${{ github.workspace }}/app-boilerplate-rust:/app \
            ${{ env.DEV_TOOLS_IMAGE }} \
            bash -c "source /opt/venv/bin/activate && pip install -r tests/standalone/requirements.txt && pytest tests/standalone/ --tb=short -v --device nanosp"
